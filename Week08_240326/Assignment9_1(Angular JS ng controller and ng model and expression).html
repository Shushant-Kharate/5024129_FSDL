<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
    <meta charset="UTF-8">
    <title>AngularJS Hello World</title>

    <!-- AngularJS CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 400px;
            text-align: center;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        input {
            width: 90%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            font-size: 16px;
        }

        input:focus {
            border-color: #667eea;
        }

        .output {
            margin-top: 20px;
            font-size: 20px;
            color: #555;
        }

        .highlight {
            color: #667eea;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- Controller -->
    <div class="card" ng-controller="myController">

        <h1>👋 Hello By Angular JS</h1>

        <!-- Input -->
        <input type="text" ng-model="name" placeholder="Enter your name">

        <!-- Expression -->
        <div class="output">
            Hello <span class="highlight">{{name || 'Guest'}}</span>
        </div>

    </div>

    <script>
        var app = angular.module("myApp", []);

        app.controller("myController", function($scope) {
            $scope.name = "Shushant";
        });
    </script>

</body>
</html>
